<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ficha D&D 5e - Universal</title>
  <style>
    /* =========================================
       CSS - ESTILO VISUAL E LAYOUT
       ========================================= */
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #121418; color: #e9ecef; padding: 20px; font-size: 13px; }
    
    /* Esconde setas de inputs numéricos */
    input[type=number]::-webkit-inner-spin-button, input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    input[type=number] { -moz-appearance: textfield; }

    .app-container { max-width: 1200px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
    
    /* Barras Superiores */
    .top-bar { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #333a46; padding-bottom: 10px; }
    .top-bar h1 { color: #d93838; font-size: 1.5rem; margin: 0; }
    .controls { display: flex; gap: 15px; align-items: center; }
    .controls select { background: #1e222b; color: #fff; border: 1px solid #444; padding: 6px; border-radius: 4px; }
    
    .status-badge { padding: 6px 12px; border-radius: 4px; font-weight: bold; font-size: 12px; text-align: center; }
    .status-loading { background: #4a3a19; color: #ffda8a; border: 1px solid #ffda8a; }
    .status-success { background: #194a2b; color: #8affaa; border: 1px solid #8affaa; }
    .status-error { background: #4a1919; color: #ff8a8a; border: 1px solid #ff8a8a; }

    /* Painéis Principais */
    .panel { background: #1e222b; border: 1px solid #2c323f; border-radius: 8px; padding: 20px; }
    .panel h2 { font-size: 14px; color: #fff; text-transform: uppercase; border-bottom: 1px solid #333a46; padding-bottom: 5px; margin-bottom: 15px; }
    
    .header-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; }
    
    .main-grid { display: grid; grid-template-columns: 260px 1fr 350px; gap: 20px; }
    @media (max-width: 900px) { .main-grid { grid-template-columns: 1fr; } }

    /* Campos de Input */
    .field { display: flex; flex-direction: column; gap: 5px; }
    .field label { font-size: 11px; color: #868e96; text-transform: uppercase; font-weight: bold; }
    .field input, .field select { background: #15181f; border: 1px solid #333a46; color: #fff; padding: 10px; border-radius: 4px; outline: none; }
    .field input:focus, .field select:focus { border-color: #d93838; }

    /* Atributos */
    .attr-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .attr-box { background: #15181f; border: 1px solid #333a46; border-radius: 6px; padding: 10px; text-align: center; }
    .attr-box label { display: block; color: #868e96; font-size: 10px; font-weight: bold; margin-bottom: 5px; }
    .attr-box input { width: 100%; background: transparent; border: none; border-bottom: 1px solid #444; color: #fff; text-align: center; font-size: 20px; font-weight: bold; padding-bottom: 5px; }
    .attr-mod { display: block; color: #d93838; font-size: 16px; font-weight: bold; margin-top: 5px; }

    /* Combate */
    .combat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 15px; }
    .combat-box { background: #15181f; border: 1px solid #333a46; border-radius: 6px; padding: 10px; text-align: center; }
    .combat-box label { display: block; font-size: 10px; color: #868e96; text-transform: uppercase; margin-bottom: 5px; }
    .combat-box .val { font-size: 22px; color: #fff; font-weight: bold; }

    /* Listas (Perícias/Saves/Magias) */
    .list-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 10px; background: #15181f; border: 1px solid #2c323f; border-radius: 4px; margin-bottom: 5px; }
    .list-row label { display: flex; align-items: center; gap: 8px; cursor: pointer; color: #ccc; }
    .list-row input[type="checkbox"] { cursor: pointer; transform: scale(1.1); }
    .list-row .mod { color: #d93838; font-weight: bold; }
    
    .spell-list { max-height: 400px; overflow-y: auto; padding-right: 5px; }
    .spell-item { background: #15181f; border: 1px solid #333a46; border-radius: 4px; padding: 8px; margin-bottom: 6px; }
    .spell-item h4 { color: #e5a93c; font-size: 12px; margin-bottom: 3px; }
    .spell-item p { color: #868e96; font-size: 10px; }
  </style>
</head>
<body>

<div class="app-container">
  
  <!-- BARRA DE CONTROLE SUPERIOR -->
  <div class="top-bar">
    <h1>Ficha de Personagem D&D 5e</h1>
    <div class="controls">
      <select id="rules-version">
        <option value="2014">Edição 2014 (Legado)</option>
        <option value="2024">Edição 2024 (Revisada)</option>
      </select>
      <select id="content-filter">
        <option value="official">Apenas Oficial</option>
        <option value="all">Oficial + Homebrew</option>
      </select>
      <div id="status-bar" class="status-badge status-loading">Inicializando sistema...</div>
    </div>
  </div>

  <!-- CABEÇALHO DA FICHA -->
  <div class="panel">
    <div class="header-grid">
      <div class="field"><label>Nome do Personagem</label><input type="text" placeholder="Ex: Mialee"></div>
      <div class="field"><label>Classe</label><select id="char-class"><option value="">Carregando...</option></select></div>
      <div class="field"><label>Subclasse</label><select id="char-subclass"><option value="">Aguardando classe...</option></select></div>
      <div class="field"><label>Nível</label><input type="number" id="char-level" value="1" min="1" max="20"></div>
      <div class="field"><label>Raça / Espécie</label><select id="char-race"><option value="">Carregando...</option></select></div>
      <div class="field"><label>Antecedente</label><select id="char-bg"><option value="">Carregando...</option></select></div>
      <div class="field"><label>Bônus de Proficiência</label><input type="text" id="prof-bonus" value="+2" readonly></div>
    </div>
  </div>

  <div class="main-grid">
    
    <!-- COLUNA 1: ATRIBUTOS E SAVES -->
    <div class="col">
      <div class="panel" style="margin-bottom: 20px;">
        <h2>Atributos</h2>
        <div class="attr-grid">
          <div class="attr-box"><label>FORÇA</label><input type="number" id="score-str" value="10"><span class="attr-mod" id="mod-str">+0</span></div>
          <div class="attr-box"><label>DESTREZA</label><input type="number" id="score-dex" value="10"><span class="attr-mod" id="mod-dex">+0</span></div>
          <div class="attr-box"><label>CONSTITUIÇÃO</label><input type="number" id="score-con" value="10"><span class="attr-mod" id="mod-con">+0</span></div>
          <div class="attr-box"><label>INTELIGÊNCIA</label><input type="number" id="score-int" value="10"><span class="attr-mod" id="mod-int">+0</span></div>
          <div class="attr-box"><label>SABEDORIA</label><input type="number" id="score-wis" value="10"><span class="attr-mod" id="mod-wis">+0</span></div>
          <div class="attr-box"><label>CARISMA</label><input type="number" id="score-cha" value="10"><span class="attr-mod" id="mod-cha">+0</span></div>
        </div>
      </div>
      <div class="panel">
        <h2>Testes de Resistência</h2>
        <div id="saves-container"></div>
      </div>
    </div>

    <!-- COLUNA 2: COMBATE E PERÍCIAS -->
    <div class="col">
      <div class="panel" style="margin-bottom: 20px;">
        <h2>Combate e Vitais</h2>
        <div class="combat-grid">
          <div class="combat-box"><label>Classe de Armadura</label><div class="val" id="combat-ac">10</div></div>
          <div class="combat-box"><label>Iniciativa</label><div class="val" id="combat-init">+0</div></div>
          <div class="combat-box"><label>Deslocamento</label><div class="val" id="combat-speed">30 ft</div></div>
          <div class="combat-box"><label>HP Máximo</label><div class="val" id="combat-hp">10</div></div>
          <div class="combat-box"><label>Dado de Vida</label><div class="val" id="combat-hd">d8</div></div>
          <div class="combat-box"><label>Perc. Passiva</label><div class="val" id="combat-pp">10</div></div>
        </div>
      </div>
      <div class="panel">
        <h2>Perícias</h2>
        <div id="skills-container"></div>
      </div>
    </div>

    <!-- COLUNA 3: MAGIAS E GRIMÓRIO -->
    <div class="col">
      <div class="panel">
        <h2>Grimório de Magias</h2>
        <div class="field" style="margin-bottom: 15px;">
          <label>Atributo / CD / Ataque</label>
          <input type="text" id="spell-stats" value="INT | CD 13 | Atk +5" readonly style="text-align: center; color: #e5a93c; font-weight: bold;">
        </div>
        <div class="spell-list" id="spell-container">
          <div class="spell-item"><p>Selecione uma classe conjuradora para carregar as magias disponíveis.</p></div>
        </div>
      </div>
    </div>

  </div>
</div>

<script>
  /* =========================================
     JAVASCRIPT - MOTOR DE DADOS E CÁLCULOS
     ========================================= */
  
  // Constantes Básicas de D&D
  const ATTRS = ['str', 'dex', 'con', 'int', 'wis', 'cha'];
  const ATTR_NAMES = { str: 'Força', dex: 'Destreza', con: 'Constituição', int: 'Inteligência', wis: 'Sabedoria', cha: 'Carisma' };
  const SKILLS = [
    { id: 'acrobatics', name: 'Acrobacia', attr: 'dex' }, { id: 'animal', name: 'Adestrar Animais', attr: 'wis' },
    { id: 'arcana', name: 'Arcanismo', attr: 'int' }, { id: 'athletics', name: 'Atletismo', attr: 'str' },
    { id: 'performance', name: 'Atuação', attr: 'cha' }, { id: 'deception', name: 'Enganação', attr: 'cha' },
    { id: 'stealth', name: 'Furtividade', attr: 'dex' }, { id: 'history', name: 'História', attr: 'int' },
    { id: 'intimidation', name: 'Intimidação', attr: 'cha' }, { id: 'insight', name: 'Intuição', attr: 'wis' },
    { id: 'investigation', name: 'Investigação', attr: 'int' }, { id: 'medicine', name: 'Medicina', attr: 'wis' },
    { id: 'nature', name: 'Natureza', attr: 'int' }, { id: 'perception', name: 'Percepção', attr: 'wis' },
    { id: 'persuasion', name: 'Persuasão', attr: 'cha' }, { id: 'sleight', name: 'Prestidigitação', attr: 'dex' },
    { id: 'religion', name: 'Religião', attr: 'int' }, { id: 'survival', name: 'Sobrevivência', attr: 'wis' }
  ];

  // Memória Global
  const AppState = {
    data: { classes: [], races: [], backgrounds: [], spells: [] },
    scores: { str: 10, dex: 10, con: 10, int: 10, wis: 10, cha: 10 },
    profs: { saves: new Set(), skills: new Set() },
    level: 1,
    currentClass: null
  };

  // Inicializa a Interface HTML
  function buildUI() {
    // Monta Saves
    document.getElementById('saves-container').innerHTML = ATTRS.map(a => `
      <div class="list-row">
        <label><input type="checkbox" id="save-chk-${a}" onchange="toggleProf('saves', '${a}')"> ${ATTR_NAMES[a]}</label>
        <span class="mod" id="save-val-${a}">+0</span>
      </div>
    `).join('');

    // Monta Perícias
    document.getElementById('skills-container').innerHTML = SKILLS.map(s => `
      <div class="list-row">
        <label><input type="checkbox" id="skill-chk-${s.id}" onchange="toggleProf('skills', '${s.id}')"> ${s.name} <span style="font-size:9px;color:#777">(${s.attr.toUpperCase()})</span></label>
        <span class="mod" id="skill-val-${s.id}">+0</span>
      </div>
    `).join('');

    // Adiciona Event Listeners nos inputs
    ATTRS.forEach(a => {
      document.getElementById(`score-${a}`).addEventListener('input', (e) => {
        AppState.scores[a] = parseInt(e.target.value) || 10;
        updateStats();
      });
    });

    document.getElementById('char-level').addEventListener('input', (e) => {
      AppState.level = parseInt(e.target.value) || 1;
      updateStats();
    });

    document.getElementById('char-class').addEventListener('change', (e) => {
      const clsName = e.target.value;
      AppState.currentClass = AppState.data.classes.find(c => c.name === clsName);
      
      // Auto-preenche o Hit Die se existir
      if (AppState.currentClass && AppState.currentClass.hd) {
        document.getElementById('combat-hd').innerText = `d${AppState.currentClass.hd.faces || 8}`;
      }
      
      updateStats();
      renderSpells();
    });

    // Menus de controle superiores
    document.getElementById('rules-version').addEventListener('change', fetchDatabase);
    document.getElementById('content-filter').addEventListener('change', populateMenus);
  }

  function toggleProf(type, key) {
    const set = AppState.profs[type];
    const isChecked = document.getElementById(`${type.slice(0,-1)}-chk-${key}`).checked;
    if (isChecked) set.add(key); else set.delete(key);
    updateStats();
  }

  function getMod(score) { return Math.floor((score - 10) / 2); }
  function formatMod(mod) { return mod >= 0 ? `+${mod}` : `${mod}`; }

  // Atualiza a matemática da ficha
  function updateStats() {
    const pb = Math.floor((AppState.level - 1) / 4) + 2;
    document.getElementById('prof-bonus').value = `+${pb}`;

    // Atributos e Saves
    ATTRS.forEach(a => {
      const mod = getMod(AppState.scores[a]);
      document.getElementById(`mod-${a}`).innerText = formatMod(mod);
      
      let saveBonus = mod + (AppState.profs.saves.has(a) ? pb : 0);
      document.getElementById(`save-val-${a}`).innerText = formatMod(saveBonus);
    });

    // Perícias e Percepção Passiva
    let percBonus = 0;
    SKILLS.forEach(s => {
      const mod = getMod(AppState.scores[s.attr]);
      let skillBonus = mod + (AppState.profs.skills.has(s.id) ? pb : 0);
      document.getElementById(`skill-val-${s.id}`).innerText = formatMod(skillBonus);
      if (s.id === 'perception') percBonus = skillBonus;
    });

    // Vitais
    const dexMod = getMod(AppState.scores.dex);
    const conMod = getMod(AppState.scores.con);
    document.getElementById('combat-init').innerText = formatMod(dexMod);
    document.getElementById('combat-ac').innerText = 10 + dexMod;
    document.getElementById('combat-pp').innerText = 10 + percBonus;
    
    // HP
    const hd = (AppState.currentClass && AppState.currentClass.hd) ? AppState.currentClass.hd.faces : 8;
    const hpMax = (hd + conMod) + (AppState.level - 1) * (Math.floor(hd/2) + 1 + conMod);
    document.getElementById('combat-hp').innerText = Math.max(1, hpMax);

    // Conjuração
    if (AppState.currentClass) {
      let spellAttr = 'int';
      const name = AppState.currentClass.name.toLowerCase();
      if (name.includes('cleric') || name.includes('druid') || name.includes('ranger')) spellAttr = 'wis';
      if (name.includes('paladin') || name.includes('bard') || name.includes('sorcerer') || name.includes('warlock')) spellAttr = 'cha';
      
      const spellMod = getMod(AppState.scores[spellAttr]);
      const dc = 8 + pb + spellMod;
      const atk = pb + spellMod;
      document.getElementById('spell-stats').value = `${ATTR_NAMES[spellAttr].toUpperCase()} | CD ${dc} | Atk ${formatMod(atk)}`;
    }
  }

  // Preenche Dropdowns ordenando Oficial > Homebrew
  function populateMenus() {
    const filter = document.getElementById('content-filter').value;
    const allowHb = (filter === 'all');
    
    function buildOptions(array) {
      let filtered = array.filter(item => allowHb || !item.isHb);
      // Sort: Official first, Homebrew last, alphabetically inside
      filtered.sort((a, b) => {
        if (a.isHb === b.isHb) return a.name.localeCompare(b.name);
        return a.isHb ? 1 : -1;
      });
      return `<option value="">Selecione...</option>` + filtered.map(item => 
        `<option value="${item.name}">${item.name} ${item.isHb ? '[Homebrew]' : ''}</option>`
      ).join('');
    }

    document.getElementById('char-class').innerHTML = buildOptions(AppState.data.classes);
    document.getElementById('char-race').innerHTML = buildOptions(AppState.data.races);
    document.getElementById('char-bg').innerHTML = buildOptions(AppState.data.backgrounds);
    renderSpells(); // Atualiza grimório caso o filtro mude
  }

  function renderSpells() {
    const container = document.getElementById('spell-container');
    if (!AppState.currentClass) {
      container.innerHTML = '<div class="spell-item"><p>Selecione uma classe para ver as magias.</p></div>';
      return;
    }

    const clsName = AppState.currentClass.name.toLowerCase();
    const allowHb = document.getElementById('content-filter').value === 'all';
    
    // Busca magias que pertencem à classe selecionada
    let mySpells = AppState.data.spells.filter(sp => {
      if (!allowHb && sp.isHb) return false;
      if (!sp.classes) return false;
      return sp.classes.some(c => c.toLowerCase() === clsName);
    });

    if (mySpells.length === 0) {
      container.innerHTML = '<div class="spell-item"><p>Esta classe não possui magias cadastradas no banco de dados, ou não é uma classe conjuradora.</p></div>';
      return;
    }

    // Agrupa por Nível
    mySpells.sort((a,b) => a.level - b.level || a.name.localeCompare(b.name));
    
    let html = '';
    let currentLevel = -1;
    mySpells.forEach(sp => {
      if (sp.level !== currentLevel) {
        currentLevel = sp.level;
        html += `<h3 style="color:#fff; margin-top:10px; font-size:12px; border-bottom:1px solid #333;">${currentLevel === 0 ? 'TRUQUES (CANTRIPS)' : `CÍRCULO ${currentLevel}`}</h3>`;
      }
      html += `
        <div class="spell-item">
          <h4>${sp.name} ${sp.isHb ? '<span style="color:#d93838">[HB]</span>' : ''}</h4>
          <p><strong>Tempo:</strong> ${sp.time} | <strong>Fonte:</strong> ${sp.source}</p>
        </div>
      `;
    });
    
    container.innerHTML = html;
  }

  // Máquina de Busca e Sincronização
  async function fetchDatabase() {
    const statusBar = document.getElementById('status-bar');
    const version = document.getElementById('rules-version').value;
    
    // URLs brutas e seguras do repositório Mirror do 5eTools
    const BASE_URL = version === '2024' 
      ? 'https://raw.githubusercontent.com/5etools-mirror-3/5etools-src/main/data' 
      : 'https://raw.githubusercontent.com/5etools-mirror-3/5etools-2014-src/main/data';

    statusBar.className = "status-badge status-loading";
    statusBar.innerText = `Sincronizando D&D ${version}...`;

    try {
      // Baixa os JSONs principais
      const [racesRes, bgRes, spellRes] = await Promise.all([
        fetch(`${BASE_URL}/races.json`),
        fetch(`${BASE_URL}/backgrounds.json`),
        fetch(`${BASE_URL}/spells/spells-phb.json`) // Puxa apenas o Player's Handbook para evitar travamento de memória
      ]);

      const rData = await racesRes.json();
      const bData = await bgRes.json();
      const sData = await spellRes.json();

      // Função Auxiliar para verificar se é Homebrew
      const isOff = (source) => ["PHB", "XPHB", "XGE", "TCE", "MM", "XMM", "DMG", "XDMG"].includes(source);

      // Processa Raças
      AppState.data.races = (rData.race || []).filter(r => !r._isBaseRace).map(r => ({
        name: r.name, isHb: !isOff(r.source)
      }));

      // Processa Backgrounds
      AppState.data.backgrounds = (bData.background || []).map(b => ({
        name: b.name, isHb: !isOff(b.source)
      }));

      // Processa Magias
      AppState.data.spells = (sData.spell || []).map(sp => {
        let classes = [];
        if (sp.classes && sp.classes.fromClassList) classes = sp.classes.fromClassList.map(c => c.name);
        return {
          name: sp.name,
          level: sp.level,
          time: sp.time ? `${sp.time[0].number} ${sp.time[0].unit}` : '1 Ação',
          source: sp.source,
          isHb: !isOff(sp.source),
          classes: classes
        };
      });

      // Classes (Mock local seguro para evitar travamento com index múltiplos do 5etools)
      AppState.data.classes = [
        { name: "Barbarian", isHb: false, hd: {faces: 12} }, { name: "Bard", isHb: false, hd: {faces: 8} },
        { name: "Cleric", isHb: false, hd: {faces: 8} }, { name: "Druid", isHb: false, hd: {faces: 8} },
        { name: "Fighter", isHb: false, hd: {faces: 10} }, { name: "Monk", isHb: false, hd: {faces: 8} },
        { name: "Paladin", isHb: false, hd: {faces: 10} }, { name: "Ranger", isHb: false, hd: {faces: 10} },
        { name: "Rogue", isHb: false, hd: {faces: 8} }, { name: "Sorcerer", isHb: false, hd: {faces: 6} },
        { name: "Warlock", isHb: false, hd: {faces: 8} }, { name: "Wizard", isHb: false, hd: {faces: 6} },
        { name: "Blood Hunter", isHb: true, hd: {faces: 10} } // Exemplo Homebrew
      ];

      populateMenus();
      updateStats();

      statusBar.className = "status-badge status-success";
      statusBar.innerText = "✓ Banco de Dados Conectado!";
      
    } catch (err) {
      console.error(err);
      statusBar.className = "status-badge status-error";
      statusBar.innerText = "❌ Falha na conexão com a internet.";
      // Fallback local se a internet cair
      AppState.data.races = [{name: "Humano", isHb: false}, {name: "Elfo", isHb: false}];
      AppState.data.backgrounds = [{name: "Acólito", isHb: false}];
      populateMenus();
    }
  }

  // Start Application
  window.onload = () => {
    buildUI();
    fetchDatabase();
  };
</script>

</body>
</html>
