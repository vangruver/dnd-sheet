<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Ficha D&D 5e</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div>
      <h1>Ficha de Personagem</h1>
      <span id="dbStatus" class="status">Dados locais prontos</span>
    </div>
    <div class="actions">
      <button id="previewBtn">Ficha em PDF</button>
      <button id="printBtn">Imprimir</button>
      <button id="saveBtn">Salvar</button>
      <button id="clearBtn" class="ghost">Limpar</button>
    </div>
  </header>

  <main id="sheet" class="sheet">
    <section class="card hero">
      <div class="grid identity">
        <label>Nome do personagem<input id="name" data-field="name"></label>
        <label>Classe<select id="class" data-field="class"></select></label>
        <label>Nível<input id="level" data-field="level" type="number" min="1" max="20" value="1"></label>
        <label>Raça<input id="race" data-field="race"></label>
        <label>Antecedente<input id="background" data-field="background"></label>
        <label>Jogador<input id="player" data-field="player"></label>
        <label>Tendência<input id="alignment" data-field="alignment"></label>
        <label>XP<input id="xp" data-field="xp" type="number" min="0"></label>
      </div>
    </section>

    <section class="card">
      <h2>Atributos</h2>
      <div class="ability-grid" id="abilities"></div>
      <div class="derived">
        <label>Proficiência<input id="proficiency" readonly></label>
        <label>Deslocamento<input id="speed" data-field="speed"></label>
        <label>Inspiração<input id="inspiration" data-field="inspiration"></label>
        <label>CA<input id="ac" data-field="ac"></label>
        <label>Iniciativa<input id="initiative" data-field="initiative" readonly></label>
        <label>PV máximo<input id="hpMax" data-field="hpMax" type="number"></label>
        <label>PV atual<input id="hpCurrent" data-field="hpCurrent" type="number"></label>
        <label>Dados de vida<input id="hitDice" data-field="hitDice"></label>
      </div>
    </section>

    <section class="card">
      <h2>Perícias</h2>
      <p class="hint">Escolha as perícias permitidas pela classe. O bônus é calculado automaticamente.</p>
      <div id="skills" class="skill-list"></div>
    </section>

    <section class="card">
      <h2>Classe e escolhas</h2>
      <div id="classInfo" class="info-box">Selecione uma classe.</div>
      <div id="classChoices"></div>
    </section>

    <section class="card">
      <h2>Magias</h2>
      <div class="spell-toolbar">
        <label>Filtro<input id="spellSearch" placeholder="Buscar magia..."></label>
        <label>Nível<select id="spellLevelFilter"></select></label>
      </div>
      <div id="spells" class="spell-list"></div>
    </section>

    <section class="card">
      <h2>Equipamentos</h2>
      <div class="equipment-tabs">
        <button data-tab="weapons" class="active">Armas</button>
        <button data-tab="armor">Armaduras</button>
        <button data-tab="gear">Equipamentos</button>
      </div>
      <div id="equipment"></div>
    </section>

    <section class="card">
      <h2>Inventário</h2>
      <div id="inventory"></div>
      <button id="addInventory">+ Adicionar item</button>
    </section>

    <section class="card">
      <h2>Características, talentos e idiomas</h2>
      <textarea id="features" data-field="features" rows="8" placeholder="Características, talentos, proficiências, idiomas..."></textarea>
    </section>

    <section class="card">
      <h2>Personalidade e história</h2>
      <div class="two-col">
        <label>Traços de personalidade<textarea data-field="traits"></textarea></label>
        <label>Ideais<textarea data-field="ideals"></textarea></label>
        <label>Vínculos<textarea data-field="bonds"></textarea></label>
        <label>Defeitos<textarea data-field="flaws"></textarea></label>
      </div>
    </section>
  </main>

  <div id="toast" class="toast"></div>
  <script src="database.js"></script>
  <script src="app.js"></script>
</body>
</html>
