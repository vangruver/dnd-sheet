<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ficha D&D 5e V4</title><link rel="stylesheet" href="style.css"></head>
<body><header class="topbar"><div><h1>Ficha D&D 5e</h1><small id="db-status">Carregando banco…</small></div><div class="toolbar">
<label>Regras<select id="edition"><option value="2024">2024</option><option value="2014">2014</option></select></label>
<label>Conteúdo<select id="content"><option value="all">Oficial + Homebrew</option><option value="official">Apenas oficial</option><option value="homebrew">Apenas Homebrew</option></select></label>
<button id="new-character">Novo</button><button id="save-character">Salvar</button><button id="export-character">Exportar</button><label class="file-button">Importar<input id="import-character" type="file" accept=".json,application/json"></label></div></header>
<main class="page"><section class="panel"><div class="section-title">Criação automática</div><div class="grid four">
<label>Nome<input id="name" placeholder="Nome"></label><label>Nível<input id="level" type="number" min="1" max="20" value="1"></label><label>Experiência<input id="xp" type="number" min="0"></label><label>Inspiração<input id="inspiration" type="number" min="0"></label></div>
<div class="grid four choice-grid"><label>Espécie / Raça<select id="race"></select></label><label>Classe<select id="class"></select></label><label>Subclasse<select id="subclass"></select></label><label>Background<select id="background"></select></label></div><p id="selection-note" class="muted"></p></section>
<nav class="tabs"><button class="tab active" data-tab="overview">Resumo</button><button class="tab" data-tab="abilities">Atributos</button><button class="tab" data-tab="skills">Perícias</button><button class="tab" data-tab="combat">Combate</button><button class="tab" data-tab="spells">Magias</button><button class="tab" data-tab="features">Progressão</button></nav>
<section id="tab-overview" class="tab-panel active"><div class="two-col"><section class="panel"><div class="section-title">Calculado automaticamente</div><div class="combat-grid">
<div class="big-stat"><span>Proficiência</span><strong id="pb">+2</strong></div><div class="big-stat"><span>PV</span><strong id="hp">—</strong></div><div class="big-stat"><span>Dado de vida</span><strong id="hit-die">—</strong></div><div class="big-stat"><span>CA</span><strong id="ac">10</strong></div><div class="big-stat"><span>Iniciativa</span><strong id="initiative">+0</strong></div><div class="big-stat"><span>Percepção passiva</span><strong id="passive">10</strong></div><div class="big-stat"><span>Deslocamento</span><strong id="speed">—</strong></div><div class="big-stat"><span>CD magia</span><strong id="spell-dc">—</strong></div><div class="big-stat"><span>Ataque mágico</span><strong id="spell-attack">—</strong></div></div></section><section class="panel"><div class="section-title">Origem</div><div id="selection-details"></div></section></div></section>
<section id="tab-abilities" class="tab-panel"><section class="panel"><div class="section-title">Atributos</div><div id="attributes" class="ability-grid"></div></section><section class="panel"><div class="section-title">Resistências</div><div id="saves" class="skill-grid"></div></section></section>
<section id="tab-skills" class="tab-panel"><section class="panel"><div class="section-title">Perícias</div><div id="skills" class="skill-grid"></div></section></section>
<section id="tab-combat" class="tab-panel"><div class="two-col"><section class="panel"><div class="section-title">Combate</div><div class="grid four"><label>PV atuais<input id="hp-current" type="number" min="0"></label><label>PV temporários<input id="hp-temp" type="number" min="0"></label><label>CA<input id="ac-input" type="number" min="0"></label><label>Deslocamento<input id="speed-input"></label></div></section><section class="panel"><div class="section-title">Ataques</div><div id="attacks"></div></section></div></section>
<section id="tab-spells" class="tab-panel"><section class="panel"><div class="section-title">Magias</div><div class="spell-toolbar"><input id="spell-search" type="search" placeholder="Pesquisar"><select id="spell-level-filter"><option value="all">Todos</option><option value="0">Truques</option><option value="1">1º</option><option value="2">2º</option><option value="3">3º</option><option value="4">4º</option><option value="5">5º</option><option value="6">6º</option><option value="7">7º</option><option value="8">8º</option><option value="9">9º</option></select></div><div id="spells" class="spell-grid"></div></section></section>
<section id="tab-features" class="tab-panel"><section class="panel"><div class="section-title">Progressão por nível</div><div id="progression" class="progression"></div></section><section class="panel"><div class="section-title">Recursos de conjuração</div><div id="spell-progression"></div></section></section>
<div id="toast" class="toast"></div></main><script type="module" src="app.js"></script></body></html>
