<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ficha D&D 5e Automatizada</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="sheet-container">
    
    <!-- HEADER E SELEÇÃO DE REGRAS -->
    <div class="top-header">
      <h1 class="main-title">Ficha de Personagem D&D 5e</h1>
      <div class="rules-select-container">
        <label for="rules-version">Versão das Regras:</label>
        <select id="rules-version">
          <option value="2014">D&D 5e (2014 - Legado)</option>
          <option value="2024">D&D 5.5e (2024)</option>
        </select>
        <span id="status-bar" class="status-bar loading">Aguardando...</span>
      </div>
    </div>

    <!-- INFORMAÇÕES DO PERSONAGEM -->
    <div class="box">
      <h2>Informações do Personagem</h2>
      <div class="grid-5">
        <div class="field">
          <label>Nome do Personagem</label>
          <input type="text" id="char-name" placeholder="Ex: Mialee">
        </div>
        <div class="field">
          <label>Classe</label>
          <select id="char-class"><option value="">Selecione uma classe...</option></select>
        </div>
        <div class="field">
          <label>Nível</label>
          <input type="number" id="char-level" value="1" min="1" max="20">
        </div>
        <div class="field">
          <label>Raça / Espécie</label>
          <select id="char-race"><option value="">Selecione uma raça...</option></select>
        </div>
        <div class="field">
          <label>Antecedente (Background)</label>
          <select id="char-background"><option value="">Selecione um antecedente...</option></select>
        </div>
        <div class="field">
          <label>Bônus de Proficiência</label>
          <input type="text" id="prof-bonus" value="+2" readonly>
        </div>
      </div>
    </div>

    <!-- ATRIBUTOS -->
    <div class="box">
      <h2>Atributos</h2>
      <div class="attributes-grid" id="attributes-container">
        <!-- Gerado pelo Javascript -->
      </div>
    </div>

    <!-- COMBATE E VITAIS -->
    <div class="box">
      <div class="grid-4">
        <div class="field"><label>Pontos de Vida (HP Máximo)</label><input type="number" id="hp-max" value="10"></div>
        <div class="field"><label>Classe de Armadura (CA)</label><input type="number" id="armor-class" value="10"></div>
        <div class="field"><label>Iniciativa</label><input type="text" id="initiative" value="+0" readonly></div>
        <div class="field"><label>Deslocamento (Speed)</label><input type="text" id="speed" value="30 ft" readonly></div>
        <div class="field"><label>Dado de Vida (Hit Die)</label><input type="text" id="hit-dice" value="d8" readonly></div>
        <div class="field"><label>Percepção Passiva</label><input type="text" id="passive-perception" value="10" readonly></div>
      </div>
    </div>

    <!-- PERÍCIAS E SALVAGUARDAS -->
    <div class="grid-2">
      <div class="box">
        <h2>Testes de Resistência</h2>
        <div class="list-container" id="saves-list"></div>
      </div>
      <div class="box">
        <h2>Perícias (Skills)</h2>
        <div class="list-container" id="skills-list"></div>
      </div>
    </div>

  </div>
  <script src="app.js"></script>
</body>
</html>
